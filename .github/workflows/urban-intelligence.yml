name: Urban intelligence regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: |
          python -m pip install pyproj==3.7.2
          npm install --prefix "$RUNNER_TEMP/streetwise-tests" --save-exact jsdom@27.4.0
      - name: Run full Python suite against shipped source snapshots
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run every JavaScript and DOM script
        env:
          JSDOM_PATH: ${{ runner.temp }}/streetwise-tests/node_modules/jsdom
        run: |
          for test in tests/*.test.cjs; do node "$test" || exit 1; done
  public_mta_source_research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query official public MTA sources on the ETL runner
        run: |
          python scripts/probe_mta_sources.py
          python -c "import json; [print('::notice::MTA source research: '+json.dumps(r)) for r in json.load(open('/tmp/streetwise-mta-research/receipts.json'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: official-mta-source-research
          path: /tmp/streetwise-mta-research/
          retention-days: 1
      - name: Save official source receipts on this same-repository review branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          REVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          mkdir -p data/urban/transit-source-research
          cp /tmp/streetwise-mta-research/*.json data/urban/transit-source-research/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/urban/transit-source-research/
          if ! git diff --cached --quiet; then
            git commit -m 'Record official public MTA source research for review'
            if ! git push origin "HEAD:$REVIEW_BRANCH" > /tmp/research-push.log 2>&1; then
              python -c "import pathlib,re; s=pathlib.Path('/tmp/research-push.log').read_text(); print('::error::Source receipt publication: '+re.sub(r'https://[^ ]+', '[repository URL]', s).replace(chr(10),' ')[:1000])"
              exit 1
            fi
          fi
