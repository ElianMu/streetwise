
name: Urban intelligence regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install isolated test dependencies
        run: |
          python -m pip install pyproj==3.7.2
          python -m pip install -r requirements.txt
          # GIS dimension pipeline (scripts/dimensions) — test-only here; server.py stays stdlib-only
          python -m pip install numpy==2.5.3 scipy==1.18.1 shapely==2.2.0 pandas==3.0.5 geopandas==1.2.0 pytest==9.1.1
          npm install --prefix "$RUNNER_TEMP/streetwise-tests" --save-exact jsdom@27.4.0

      - name: Run full Python suite against shipped source snapshots
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run 12-dimension GIS pipeline tests (units, buffers, scoring, exported data integrity)
        run: python -m pytest tests/test_dimensions.py -q

      - name: Run every JavaScript and DOM script
        env:
          JSDOM_PATH: ${{ runner.temp }}/streetwise-tests/node_modules/jsdom
        run: |
          for test in tests/*.test.cjs; do
            node "$test" || exit 1
          done

  runtime_capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      matrix:
        python: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Guard runtime memory with three real route clients
        run: python scripts/check_capacity.py

  public_mta_source_research:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Query official public MTA sources on the ETL runner
        run: |
          python scripts/probe_mta_sources.py
          python -c "import json; [print('::notice::MTA source research: '+json.dumps(r)) for r in json.load(open('/tmp/streetwise-mta-research/receipts.json'))]"

      - uses: actions/upload-artifact@v4
        with:
          name: official-mta-source-research
          path: /tmp/streetwise-mta-research/
          retention-days: 1
