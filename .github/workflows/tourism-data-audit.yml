name: Tourism source refresh and quality audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh changed publisher versions and measure data
        run: |
          python scripts/build_inspections.py
          python scripts/build_citywide_places.py
          python scripts/build_tourism_categories.py
          python scripts/build_registry.py
          python scripts/build_audit_report.py
      - name: Validate evidence and safe failure paths
        run: python -m unittest discover -s tests -p test_tourism_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-before-publication-tourism-snapshot
          path: |
            data/inspections/dohmh.json.gz
            data/places/citywide.json
            data/places/category_catalog.json
            data/registry.json
            data/audit.json
            DATA_AUDIT_REPORT.md
          retention-days: 14
# Produces a reviewable artifact only. No automatic production overwrite or credentials.
